<!DOCTYPE html>
<html>
<head>
  <title>Blog Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">

    <div class="photo"></div>

    <div class="text">
      <div class="date">3 week ago</div>
      <div class="title">Post Three</div>
      <div class="description">
        Repudiandae corrupti amet temporibus omnis provident illum maxime. Ducimus, lorem ipsum dolor adipisicing elit
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="number">5m</div>
        <div class="label">READ</div>
      </div>
      <div class="stat">
        <div class="number">3021</div>
        <div class="label">VIEWS</div>
      </div>
      
      <div class="stat">
        <div class="number">15</div>
        <div class="label">COMMENTS</div>
      </div>
    </div>

  </div>

</body>
</html>
